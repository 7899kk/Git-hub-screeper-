name: Build mobile web preview
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      PRICEPULSE_PAGES_BASE_PATH: /${{ github.event.repository.name }}
      EXPO_PUBLIC_API_URL: ${{ vars.PRICEPULSE_PREVIEW_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: pricepulse-github-pages
          path: mobile/dist/web
          include-hidden-files: true
